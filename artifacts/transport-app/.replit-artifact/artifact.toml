kind = "mobile"
previewPath = "/"
title = "TransMóvil - Plataforma de Transporte"
version = "1.0.0"
id = "artifacts/transport-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22726

[services.development]
run = "pnpm --filter @workspace/transport-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/transport-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/transport-app", "run", "serve" ]

[services.env]
PORT = "22726"
BASE_PATH = "/"
